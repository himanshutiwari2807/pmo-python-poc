[project]
name = "pmo-python-poc"
version = "0.1.0"
description = "Local POC validating FastAPI + Celery + MySQL + Redis + React architecture for Publisher CMO/PMO"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
